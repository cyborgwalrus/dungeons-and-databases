services:
  redis:
    image: redis:7-alpine
    container_name: dnd_redis
    ports:
      - "6379:6379"
    networks:
      - dnd_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dnd_backend
    command: /app/backend/start-backend.sh
    ports:
      - "10000:10000"
    environment:
      - SECRET_KEY=supersecretdevkey
      - ADMIN_PASSWORD=admin
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - WIPE_DB_ON_RESTART=true
      - CACHE_TYPE=RedisCache
      - CACHE_REDIS_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - PORT=10000
    volumes:
      - ./backend:/app/backend
      - dnd_db:/app/instance
    depends_on:
      - redis
    networks:
      - dnd_network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT}/api/docs').getcode()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-tests:
    build:
      context: .
      dockerfile: backend/Dockerfile.tests
    container_name: dnd_backend_tests
    command: uv run pytest --cov=backend --cov-report=html:/app/htmlcov
    environment:
      - SECRET_KEY=test-secret-key
      - ADMIN_PASSWORD=admin
      - CACHE_TYPE=SimpleCache
    volumes:
      - ./htmlcov:/app/htmlcov
    networks:
      - dnd_network
    profiles:
      - test

  adminer:
    image: adminer:4.8.1
    container_name: dnd_adminer
    environment:
      - ADMIN_PASSWORD=admin
    user: root
    volumes:
      - dnd_db:/app/instance
      - ./backend/adminer/plugins-enabled:/var/www/html/plugins-enabled:ro
    depends_on:
      - backend
    networks:
      - dnd_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dnd_frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - dnd_network

  ngrok:
    image: ngrok/ngrok:alpine
    container_name: dnd_ngrok
    command: http frontend:8080 --domain=indivisible-hermitically-soren.ngrok-free.dev
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - frontend
    networks:
      - dnd_network

networks:
  dnd_network:
    driver: bridge

volumes:
  dnd_db:
    driver: local
