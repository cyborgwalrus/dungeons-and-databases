services:
  postgres:
    image: postgres:16-alpine
    container_name: dnd_postgres
    environment:
      - POSTGRES_DB=dnd
      - POSTGRES_USER=dnd
      - POSTGRES_PASSWORD=dnd
    networks:
      - dnd_network

  redis:
    image: redis:7-alpine
    container_name: dnd_redis
    ports:
      - "6379:6379"
    networks:
      - dnd_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dnd_backend
    command: /app/backend/start-backend.sh
    ports:
      - "10000:10000"
    environment:
      - SECRET_KEY=supersecretdevkey
      - ADMIN_PASSWORD=admin
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_URL=postgresql+psycopg://dnd:dnd@postgres:5432/dnd
      - CACHE_TYPE=RedisCache
      - CACHE_REDIS_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - PORT=10000
    volumes:
      - ./backend:/app/backend
    depends_on:
      - postgres
      - redis
    networks:
      - dnd_network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT}/api/docs').getcode()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-tests:
    build:
      context: .
      dockerfile: backend/Dockerfile.tests
    container_name: dnd_backend_tests
    command: uv run pytest --cov=backend --cov-report=html:/app/htmlcov
    environment:
      - SECRET_KEY=test-secret-key
      - ADMIN_PASSWORD=admin
      - CACHE_TYPE=SimpleCache
    volumes:
      - ./htmlcov:/app/htmlcov
    networks:
      - dnd_network
    profiles:
      - test

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dnd_frontend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BACKEND_HOST=backend
      - BACKEND_PORT=10000
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - dnd_network

  adminer:
    image: adminer:4.8.1
    container_name: dnd_adminer
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - dnd_network

networks:
  dnd_network:
    driver: bridge