services:
  postgres:
    image: postgres:16-alpine
    container_name: dnd_postgres
    environment:
      - POSTGRES_DB=dnd
      - POSTGRES_USER=dnd
      - POSTGRES_PASSWORD=dnd
    volumes:
      - dnd_pgdata:/var/lib/postgresql/data
    networks:
      - dnd_network

  redis:
    image: redis:7-alpine
    container_name: dnd_redis
    networks:
      - dnd_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dnd_backend
    environment:
      - SECRET_KEY=supersecretdevkey
      - ADMIN_PASSWORD=admin
      - FLASK_ENV=production
      - WIPE_DB_ON_RESTART=false
      - DATABASE_URL=postgresql+psycopg://dnd:dnd@postgres:5432/dnd
      - CACHE_TYPE=RedisCache
      - CACHE_REDIS_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - dnd_network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/docs').getcode()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dnd_frontend
    ports:
      - "8080:8080"
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=5000
    depends_on:
      - backend
    networks:
      - dnd_network

  adminer:
    image: adminer:4.8.1
    container_name: dnd_adminer
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - dnd_network

networks:
  dnd_network:
    driver: bridge

volumes:
  dnd_pgdata:
    driver: local
