name: Test Publish Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  # JOB 1: Run Tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and setup cache
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: |
          export UV_CACHE_DIR=$(uv cache dir)
          docker compose --profile test run --rm backend-tests
          docker compose --profile test run --rm --entrypoint "rm -f /app/htmlcov/.gitignore" backend-tests

      # We must "upload" the coverage folder so the next job can "download" it
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # JOB 2: Publish Coverage (Runs only if Test passes)
  publish-docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download coverage results
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./htmlcov

      - name: Upload coverage report to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./htmlcov
          allow_empty_commit: true
          force_orphan: true
  
  # JOB 3: Test Production Deployment (Runs only if Test passes)
  test-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and setup cache
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and run production containers
        run: |
          export UV_CACHE_DIR=$(uv cache dir)
          docker compose -f docker-compose.prod.yml up --build -d --wait

  # JOB 4: Deploy to Production (Runs only if Test passes)
  deploy:
    needs: test-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Production Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git push origin main:production --force