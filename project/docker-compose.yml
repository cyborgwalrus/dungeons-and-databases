services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dnd_backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
    volumes:
      - ./backend:/app
    networks:
      - dnd_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dnd_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - dnd_network
    environment:
      - VITE_API_BASE=http://localhost:5000/api

networks:
  dnd_network:
    driver: bridge
