services:
  - type: keyvalue
    name: dnd-redis
    region: frankfurt
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: dnd-backend
    region: frankfurt
    plan: free
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: "5000"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: WIPE_DB_ON_RESTART
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: dnd-database
          property: connectionString
      - key: CACHE_TYPE
        value: RedisCache
      - key: CACHE_REDIS_URL
        fromService:
          name: dnd-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dnd-redis
          type: keyvalue
          property: connectionString

  - type: web
    name: dungeons-and-databases
    region: frankfurt
    plan: free
    runtime: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: BACKEND_URL
        value: "https://dnd-backend-853s.onrender.com"
      - key: BACKEND_HOST
        fromService:
          name: dnd-backend
          type: web
          property: host
      - key: BACKEND_PORT
        fromService:
          name: dnd-backend
          type: web
          property: port
    healthCheckPath: /

databases:
  - name: dnd-database
    region: frankfurt
    plan: free
