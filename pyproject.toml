[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeons-and-databases-backend"
version = "0.1.0"
description = "Flask backend for Dungeons & Databases"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "Flask-RESTful==0.3.10",
    "Flask-Caching==2.4.0",
    "Flask-Cors==6.0.1",
    "Flask-MonitoringDashboard==5.0.2",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.0.49",
    "sqlmodel==0.0.38",
    "psycopg[binary]==3.2.10",
    "psycopg2-binary==2.9.10",
    "itsdangerous==2.2.0",
    "redis==7.4.0",
    "Werkzeug==3.1.8",
    "gunicorn==23.0.0",
    "flasgger==0.9.7b2",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pylance==4.0.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=backend --cov-report=html"